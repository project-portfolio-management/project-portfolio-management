[package]
name = "project-portfolio-management-migration"
version = "0.2.0"
edition = "2021"
rust-version = "1.97"
description = "Database migrations for the project portfolio management service (frozen SQL, run by sqlx)"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
repository = "https://github.com/project-portfolio-management/project-portfolio-management"
keywords = ["portfolio", "project", "migration", "database"]
categories = ["database"]

[lib]
name = "project_portfolio_management_migration"
path = "src/lib.rs"

[dependencies]
# `migrate` for the runner and its history table (`build.rs` embeds `migrations/`).
sqlx = { version = "0.9", default-features = false, features = ["migrate", "postgres", "runtime-tokio"] }
tracing = { version = "0.1" }
