# cargo-deny supply-chain policy (SEC-I1). Used by the `deny` job in
# .github/workflows/ci.yml (`cargo deny --all-features check`) and by the release workflow. Copied per crate (drift-accepted,
# same posture as the other per-crate configs); keep the crates in sync
# when this policy changes.

[advisories]
version = 2
yanked = "warn"
# Transitive advisories that cannot be fixed at this level, accepted here WITH their reasons and revisited on each
# upgrade. Removing Loco removed most of this list. Real, actionable advisories NOT on it still fail the build.
ignore = [
    "RUSTSEC-2024-0384", # instant (unmaintained), transitive
    "RUSTSEC-2024-0436", # paste (unmaintained), transitive
    "RUSTSEC-2024-0449", # unsafe-libyaml (unmaintained), transitive: loco-gen -> rrgen -> serde_yaml; added 2026-10-13
    "RUSTSEC-2025-0134", # rustls-pemfile (unmaintained; a thin wrapper over rustls-pki-types), transitive (loco tree); added 2026-10-10
    "RUSTSEC-2026-0440", # astral-tokio-tar (unmaintained), no safe upgrade: test-only, via testcontainers, not in a built service; added 2026-11-05
    "RUSTSEC-2026-0441", # pin-utils (unmaintained), no safe upgrade: only with the optional `fluvio` feature, not in the default build; added 2026-11-05
    # Since axa 0.19 (2026-11-17), axa brings no chrono: it now comes from the service's own code, its sqlx `chrono` and
    # schemars `chrono04` features, chrono-tz, axum-test's expect-json (tests only) and fluvio (humantime); the service's
    # move to jiff leaves only the last two.
    # chrono, and so chrono-tz and humantime, were declared unmaintained (chronotope/chrono#1768). Unmaintained, not
    # vulnerable; no safe upgrade. chrono is used throughout the service and also arrives through sqlx, axa, schemars
    # and axum-test, so leaving it is a migration (to jiff or time), not an upgrade. Exceptions under
    # governance/security-policy.md section 16; added 2026-11-17; expire 2027-05-17, or when sqlx and axa offer a
    # chrono-free build, whichever is sooner.
    "RUSTSEC-2026-0543", # chrono (unmaintained)
    "RUSTSEC-2026-0555", # chrono-tz (unmaintained)
    "RUSTSEC-2026-0542", # humantime (unmaintained, wraps chrono): only with the optional `fluvio` feature
]

[licenses]
version = 2
# Permissive licenses used across the Rust stack. A dependency
# whose license is not listed FAILS the check — a deliberate signal to
# review a new license, not to silently accept it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Local, unpublished crates (the service itself, its `migration` member)
# carry no `license` field and must not be license-checked.
private = { ignore = true }

[bans]
# Duplicate versions are a warning (the dependency tree pulls a few);
# not a hard failure, so the gate stays green while still surfacing bloat.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
