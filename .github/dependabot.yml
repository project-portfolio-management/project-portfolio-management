version: 2
updates:
  - package-ecosystem: cargo
    directory: /project-portfolio-management-service-with-rust
    schedule:
      interval: weekly
    groups:
      cargo-api:
        patterns: ["*"]
    ignore:
      # loco-rs 1.2 depends on axum-test 17 and jsonwebtoken 9; the tests use loco's TestServer, so a different
      # major here breaks them (mismatched types). Revisit when loco-rs moves.
      - dependency-name: axum-test
        update-types: ["version-update:semver-major"]
      - dependency-name: jsonwebtoken
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /project-portfolio-management-matcher-with-rust
    schedule:
      interval: weekly
    groups:
      cargo-matcher:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /project-portfolio-management-ui-with-svelte
    schedule:
      interval: weekly
    groups:
      npm-ui:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native compiler) breaks svelte-check 4.7.6 ("Cannot read properties of
      # undefined (reading 'readFile')", seen in the Dependabot run on 2026-10-12). Stay on 6.x until
      # svelte-check supports 7; 6.x patch and minor updates still arrive.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # The action's tag IS the Rust toolchain version and must equal rust-toolchain.toml; it is bumped by hand
      # together with that file (Dependabot proposed 1.120.0, which is not a Rust release).
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: docker
    directory: /project-portfolio-management-service-with-rust
    schedule:
      interval: weekly
