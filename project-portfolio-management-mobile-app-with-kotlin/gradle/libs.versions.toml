# Toolchain versions match vendor/lily-design-system/lily-design-system-kotlin/gradle/libs.versions.toml, so the composite
# build resolves one Android Gradle plugin and one Kotlin (spec/mobile-apps.md MA-5). Bump them together with Lily's.
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
compose-bom = "2026.11.01"
kotlinx-serialization = "1.13.0"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
browser = "1.10.0"
core-ktx = "1.19.0"
okhttp = "5.5.1"
desugar = "2.1.5"
junit = "4.13.2"
robolectric = "4.18.1"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
# Lily is not published (MA-5): this coordinate is substituted by the included build in settings.gradle.kts.
lily = "0.1.0"

[libraries]
lily-compose = { module = "io.github.lilydesignsystem:lily-compose", version.ref = "lily" }
lily-compose-themes = { module = "io.github.lilydesignsystem:lily-compose-themes", version.ref = "lily" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-junit4-accessibility = { module = "androidx.compose.ui:ui-test-junit4-accessibility" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
