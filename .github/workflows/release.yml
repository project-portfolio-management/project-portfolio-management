name: Release

# Push a tag `vX.Y.Z` to publish a release. The tag must equal the API crate's
# version; the matcher and UI versions are reported (they version independently).
# Action pinning: major-version tags; full-SHA pinning is the stricter option.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  API: project-portfolio-management-service-with-rust
  MATCHER: project-portfolio-management-matcher-with-rust
  UI: project-portfolio-management-ui-with-svelte

jobs:
  verify:
    name: Verify tag and versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      major_minor: ${{ steps.v.outputs.major_minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          crate_version() { sed -n 's/^version *= *"\(.*\)"/\1/p' "$1" | head -1; }
          api="$(crate_version "$API/Cargo.toml")"
          matcher="$(crate_version "$MATCHER/Cargo.toml")"
          ui="$(sed -n 's/^ *"version": *"\(.*\)",*/\1/p' "$UI/package.json" | head -1)"
          echo "tag=$version api=$api matcher=$matcher ui=$ui"
          if [ "$version" != "$api" ]; then
            echo "::error::tag $tag does not match the API crate version $api"
            exit 1
          fi
          # The UI is released with the service, so its version must agree too (HD-8).
          if [ "$version" != "$ui" ]; then
            echo "::error::tag $tag does not match the UI package version $ui"
            exit 1
          fi
          # The matcher crate is versioned independently; surface its value.
          echo "::notice::matcher crate $matcher, UI package $ui"
          # Release notes must exist (also proves the CHANGELOG has the section).
          scripts/release-notes.sh "$tag" "$API/CHANGELOG.md" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"

  deny:
    name: cargo deny
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        crate:
          - project-portfolio-management-service-with-rust
          - project-portfolio-management-matcher-with-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.crate }}/Cargo.toml
          arguments: --all-features
          command: check

  image:
    name: Build and push the container image
    needs: [verify, deny]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # provenance / attestation signing
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.API }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build fails unless VERSION equals the crate's version (see the Dockerfile).
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - run: echo "Pushed ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: CycloneDX SBOMs
    needs: [verify, deny]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
      # No build cache in a release job: a poisoned cache must not reach a published artifact.
      - run: cargo install cargo-cyclonedx --locked
      - name: Rust SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom
          for crate in "$API" "$MATCHER"; do
            (cd "$crate" && cargo cyclonedx --format json --override-filename "$crate.cdx")
            mv "$crate/$crate.cdx.json" "sbom/$crate.cdx.json"
            python3 scripts/check-sbom.py "sbom/$crate.cdx.json" "$crate/Cargo.lock"
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: UI SBOM
        working-directory: ${{ env.UI }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          # `pnpm sbom` reads pnpm's own lock file (cyclonedx-npm refuses to run under pnpm).
          # No --prod: the app bundles its development-time dependencies into what ships.
          pnpm sbom --sbom-format cyclonedx > "$GITHUB_WORKSPACE/sbom/$UI.cdx.json"
          python3 "$GITHUB_WORKSPACE/scripts/check-sbom.py" "$GITHUB_WORKSPACE/sbom/$UI.cdx.json" pnpm-lock.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: [verify, image, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - name: Extract notes from CHANGELOG.md
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" "$API/CHANGELOG.md" > release-notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo
            echo "Container image: \`ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }}\` (digest \`${{ needs.image.outputs.digest }}\`)"
          } >> release-notes.md
          gh release create "$GITHUB_REF_NAME" sbom/*.cdx.json \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
