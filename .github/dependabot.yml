version: 2
updates:
  - package-ecosystem: cargo
    directory: /project-portfolio-management-service-with-rust
    schedule:
      interval: weekly
    groups:
      cargo-api:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /project-portfolio-management-matcher-with-rust
    schedule:
      interval: weekly
    groups:
      cargo-matcher:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /project-portfolio-management-ui-with-svelte
    schedule:
      interval: weekly
    groups:
      npm-ui:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native compiler) breaks svelte-check 4.7.6 ("Cannot read properties of
      # undefined (reading 'readFile')", seen in the Dependabot run on 2026-10-12). Stay on 6.x until
      # svelte-check supports 7; 6.x patch and minor updates still arrive.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /project-portfolio-management-service-with-rust
    schedule:
      interval: weekly
