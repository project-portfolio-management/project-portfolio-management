# Test coverage with cargo-tarpaulin 0.37.6, without a database: `make coverage` (or `cargo tarpaulin`) from this
# directory. tarpaulin reads this file by itself; `tarpaulin-db.toml` is the same with the database suites added
# (CI's `coverage` job, `make coverage-db`). Keep the two files' `exclude-files` lists identical: a test
# (`tests/coverage_config.rs`) refuses them if they differ.
#
# Each section below is one run; tarpaulin merges the runs into one report, written by `[report]`.
#
# Engine: LLVM source-based coverage (`-C instrument-coverage`), on macOS (where it is the only engine) and on Linux
# alike, so a local figure and CI's compare. ptrace, Linux's other choice, follows a child process only with
# `follow-exec`, and the suites that change process-wide state run each test in a child process of the test binary
# (`axa_test::own_process!`); LLVM's runtime writes a profile from every process (`%m-%p`), children included.
#
# What is not counted (the denominator is the code the service, the domain crate, the datetime crate and the
# migration runner ship), one reason per pattern:
#   tests/*, domain/tests/*  integration tests and their helpers: test code, not code under test
#   benches/*, domain/benches/*, datetime/benches/*
#                            Criterion benchmarks: measured, not tested
#   fuzz/*                   cargo-fuzz targets: a crate outside the workspace, run weekly by fuzz.yml
#   migration/build.rs       a build script: runs at compile time, never under a test
#   src/openapi_bodies.rs    generated by scripts/generate-openapi-bodies.py (a table of schemas, not logic)
#   src/auth/tests.rs, src/auth/area_tests.rs, src/tba/tests.rs, src/datetime/golden.rs
#                            unit-test modules in files of their own (`#[cfg(test)] mod …;`); test functions in a
#                            module inside a source file are left out by tarpaulin itself (its default
#                            `--ignore-tests`)
#   target/*                 sources build scripts write into the target directory (dependencies' probes)
#
# Every run builds into target/tarpaulin (instrumented, so kept apart from target/debug) and with `skip-clean`:
# tarpaulin's default is to delete the target directory's debug/ before each run, which would throw away the ordinary
# build and rebuild the service once per section.
#
# No threshold (`fail-under`) is set: the baseline is recorded in COVERAGE.md and a gate is still to be decided.

[unit]
# `cargo test --workspace --lib`: the service's, the domain crate's, the datetime crate's and the migration crate's
# unit tests.
workspace = true
run-types = ["Lib"]
engine = "Llvm"
timeout = "600s"
target-dir = "target/tarpaulin"
skip-clean = true
exclude-files = [
  "tests/*",
  "domain/tests/*",
  "benches/*",
  "domain/benches/*",
  "datetime/benches/*",
  "fuzz/*",
  "migration/build.rs",
  "src/openapi_bodies.rs",
  "src/auth/tests.rs",
  "src/auth/area_tests.rs",
  "src/tba/tests.rs",
  "src/datetime/golden.rs",
  "target/*",
]

[integration]
# `cargo test --test main`: the one integration-test binary, every test in it that needs no database (the rest are
# `#[ignore]`d).
test = ["main"]
engine = "Llvm"
timeout = "600s"
target-dir = "target/tarpaulin"
skip-clean = true
exclude-files = [
  "tests/*",
  "domain/tests/*",
  "benches/*",
  "domain/benches/*",
  "datetime/benches/*",
  "fuzz/*",
  "migration/build.rs",
  "src/openapi_bodies.rs",
  "src/auth/tests.rs",
  "src/auth/area_tests.rs",
  "src/tba/tests.rs",
  "src/datetime/golden.rs",
  "target/*",
]

[report]
# HTML to read, lcov for editors and other tools, JSON for `scripts/coverage-summary.py`. `target/` is ignored.
out = ["Html", "Lcov", "Json"]
output-dir = "target/coverage"
