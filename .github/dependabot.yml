version: 2
updates:
  - package-ecosystem: cargo
    directory: /project-portfolio-management-service-with-rust
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      cargo-api:
        patterns: ["*"]
    ignore:
      # axum-test follows axa (axa-test depends on it; a different major breaks the tests with mismatched types), and
      # jsonwebtoken stays at the version the Keycloak and OIDC code was written against (AGENTS.md). Revisit with axa.
      - dependency-name: axum-test
        update-types: ["version-update:semver-major"]
      - dependency-name: jsonwebtoken
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /project-portfolio-management-matcher-with-rust
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      cargo-matcher:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /project-portfolio-management-ui-with-svelte
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      npm-ui:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native compiler) breaks svelte-check 4.7.6 ("Cannot read properties of
      # undefined (reading 'readFile')", seen in the Dependabot run on 2026-10-12). Stay on 6.x until
      # svelte-check supports 7; 6.x patch and minor updates still arrive.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /project-portfolio-management.github.io
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      npm-site:
        patterns: ["*"]
    ignore:
      # The same TypeScript 7 hold as the UI (svelte-check).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # The repository-level tooling (syncpack only); see the root package.json.
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      npm-root:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # The action's tag IS the Rust toolchain version and must equal rust-toolchain.toml; it is bumped by hand
      # together with that file (Dependabot proposed 1.120.0, which is not a Rust release).
      - dependency-name: dtolnay/rust-toolchain
  - package-ecosystem: docker
    directory: /project-portfolio-management-service-with-rust
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /project-portfolio-management-ui-with-svelte
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ci/postgres-tls
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  # Compose files hold digest-pinned images too (the demo, the Fluvio stack, the test stack).
  - package-ecosystem: docker-compose
    directory: /
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /project-portfolio-management-service-with-rust
    # A release is trusted after it has been out a week, not on the day it is published.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
