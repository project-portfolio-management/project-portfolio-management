# Run the Project Portfolio Management API with its database.
#
#   podman compose up -d --build --wait
#   curl -fsS http://localhost:5150/_health
#   podman compose down -v                     # stop and delete the database volume
#
# Build context is this directory (the repository root); the image is built
# from project-portfolio-management-service-with-rust/Dockerfile.
#
# SAFE BY DEFAULT: the API container runs with login enforcement ON
# (PROJECT_PORTFOLIO_MANAGEMENT_REQUIRE_AUTH=true): every route except
# /_health, /_ping, the OpenAPI documents and metrics demands a valid PASETO
# bearer token. To verify tokens it needs the public keys of whatever service
# issues them. MINIMAL ENVIRONMENT for a usable stack (put in a `.env` file
# next to this file, or export before `compose up`):
#
#   POSTGRES_PASSWORD=<a long random password>             # required
#   PPM_PASETO_KEYS_URL=https://auth.example.com/.well-known/paseto-keys
#       # fetched at boot and refreshed; or, instead, inline the key set:
#   PPM_PASETO_KEYS='{"keys":[...]}'                        # Ed25519 JWK set
#   PPM_TOKEN_ISSUER=authentication-service                 # expected `iss` (default shown)
#   PPM_TOKEN_AUDIENCE=main-x-service                       # expected `aud` (default shown)
#
# With neither keys variable set the service REFUSES TO START (login is on and
# nothing could verify a token), which is the safe failure. For a throwaway
# stack that proves the secure defaults boot, `scripts/smoke-keys.sh` prints a
# public-only key set (it can verify tokens but mint none).
#
# DEVELOPMENT OVERRIDE (UNSAFE, NEVER FOR A SHARED NETWORK): the compose
# profile `dev-insecure` starts `api-dev-insecure` instead, with login
# enforcement and rate limiting OFF (config/container-dev.yaml; the service
# refuses to run that way in the `production` environment), so you can poke
# the API with curl and no token issuer:
#
#   podman compose --profile dev-insecure up -d --build --wait postgres migrate api-dev-insecure
#
# Do not run both `api` and `api-dev-insecure` at once (they share host port 5150).
#
# THE DEMONSTRATION (profile `demo`, fictitious data, sign in as example@example.com): operations/demo.md.
#
#   podman compose --profile demo up -d --build --wait && open http://localhost:3000
#
# EMAIL (optional): the compose profile `mail` adds a Stalwart mail server (SMTP, IMAP and JMAP in one
# container) so notifications can be sent and read without an outside mail host:
#
#   podman compose --profile mail up -d mail          # the server on its own
#   SMTP_HOST=mail SMTP_PORT=587 EMAIL_FROM=ppm@example.test podman compose --profile mail up -d
#
# Stalwart starts in a bootstrap mode: its administration page (http://127.0.0.1:8081/, user `admin`,
# password pinned by PPM_MAIL_ADMIN=admin:<password>, else the one-time one in the mail log) is where the domain, an account for the API and the certificate are set
# up once. Until then it listens on the administration port only. Steps and limits:
# operations/email-with-stalwart.md. The ports are bound to 127.0.0.1; they are a development and
# small-site convenience, not a hardened public mail host.
#
# The UI (project-portfolio-management-ui-with-svelte) is the compose profile `ui`: a Node server
# (SvelteKit, adapter-node) on http://localhost:3000 that proxies to the API with the session's token.
#
#   podman compose --profile ui up -d --build --wait
#
# Sign-in goes through your token issuer (AUTH_API_URL, default the API itself). Behind a TLS proxy, have the
# proxy send X-Forwarded-Proto: https (project-portfolio-management-ui-with-svelte/container-server.mjs). It is a separate profile so the default stack
# (and the CI container and ZAP jobs) stays the API and its database.

name: project-portfolio-management

x-api-environment: &api-environment
  LOCO_ENV: production
  PORT: "5150"
  DATABASE_URL: postgres://ppm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (any value for local use)}@postgres:5432/project_portfolio_management
  # The cache (Redis). The password defaults to the database's so a local stack needs one secret.
  PROJECT_PORTFOLIO_MANAGEMENT_REDIS_URL: redis://:${PPM_REDIS_PASSWORD:-${POSTGRES_PASSWORD}}@redis:6379/0
  PROJECT_PORTFOLIO_MANAGEMENT_PASETO_KEYS_URL: ${PPM_PASETO_KEYS_URL:-}
  PROJECT_PORTFOLIO_MANAGEMENT_PASETO_KEYS: ${PPM_PASETO_KEYS:-}
  PROJECT_PORTFOLIO_MANAGEMENT_TOKEN_ISSUER: ${PPM_TOKEN_ISSUER:-authentication-service}
  PROJECT_PORTFOLIO_MANAGEMENT_TOKEN_AUDIENCE: ${PPM_TOKEN_AUDIENCE:-main-x-service}
  # Uploaded files and export files live here (a named volume, so they survive a
  # restart; back them up with the database: operations/backup-and-restore.md).
  PROJECT_PORTFOLIO_MANAGEMENT_ARTIFACT_DIR: /app/data/artifacts
  # The full-text index is derived from the database and rebuilt on demand
  # (`task search_reindex`); it is kept on a volume only to avoid a rebuild on restart.
  PROJECT_PORTFOLIO_MANAGEMENT_SEARCH_INDEX_PATH: /app/data/search-index
  # Outgoing email (notifications, sinks). Empty by default: no mail is sent. With the `mail` profile
  # (below), SMTP_HOST=mail SMTP_PORT=587 points the API at the bundled Stalwart server; see
  # operations/email-with-stalwart.md.
  SMTP_HOST: ${SMTP_HOST:-localhost}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  PROJECT_PORTFOLIO_MANAGEMENT_EMAIL_FROM: ${EMAIL_FROM:-}

x-api-build: &api-build
  context: .
  dockerfile: project-portfolio-management-service-with-rust/Dockerfile

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: ppm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (any value for local use)}
      POSTGRES_DB: project_portfolio_management
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./ci/postgres-init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppm -d project_portfolio_management"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # The cache. Not published on the host; only the API reaches it. It holds nothing that cannot be rebuilt
  # (cached reads, each with a short lifetime), so there is no volume.
  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--requirepass", "${PPM_REDIS_PASSWORD:-${POSTGRES_PASSWORD}}", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASS\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASS: ${PPM_REDIS_PASSWORD:-${POSTGRES_PASSWORD}}

  # One-shot: applies the migrations compiled into the binary, then exits.
  # (config/production.yaml sets auto_migrate: false on purpose.)
  migrate:
    build: *api-build
    image: project-portfolio-management-service:local
    command: ["/app/project-portfolio-management", "db", "migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: project-portfolio-management-service:local
    environment:
      <<: *api-environment
      PROJECT_PORTFOLIO_MANAGEMENT_REQUIRE_AUTH: "true"
    ports:
      - "5150:5150"
    volumes:
      - ppm-artifacts:/app/data/artifacts
      - ppm-search:/app/data/search-index
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:5150/_readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # The UI (profile `ui`). Sessions are kept in memory (one replica); OIDC_SESSION_STORE=redis shares them.
  ui:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: project-portfolio-management-ui-with-svelte/Dockerfile
    image: project-portfolio-management-ui:local
    environment:
      PROJECT_PORTFOLIO_MANAGEMENT_API_URL: http://api:5150
      AUTH_API_URL: ${AUTH_API_URL:-http://api:5150}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

  # ---- The demonstration (profile `demo`): see operations/demo.md ---------------------------------
  # An API that trusts one published test key and a database that holds only FICTITIOUS data, a UI whose sign-in accepts only
  # example@example.com, and a one-shot job that fills the API with the made-up Northgate portfolio.
  # NEVER point this at real data or put it on a shared network.
  api-demo:
    profiles: ["demo"]
    build: *api-build
    image: project-portfolio-management-service:local
    environment:
      <<: *api-environment
      LOCO_ENV: container-dev
      # Login is ON. The API trusts one PUBLISHED test key (its private half is in the UI's demonstration code and
      # in scripts/demo/token.mjs), so the signed-in demonstration person has a real identity: "My work", saved
      # views and the kanban board work. Safe only because the data is fictitious.
      PROJECT_PORTFOLIO_MANAGEMENT_REQUIRE_AUTH: "true"
      PROJECT_PORTFOLIO_MANAGEMENT_PASETO_KEYS: '{"keys":[{"kty":"OKP","crv":"Ed25519","use":"sig","kid":"sUcFiI9KaDkaCapZaN0l0Ww7unuzttFb81TY3KroWkc","x":"11l5O7wTooGagnx2rbb7qKSa7gB_SfLQmS2ZuCWtLEg"}]}'
      # Two programmes may be in delivery at once: the third waits in the start queue (the demonstration shows it).
      PROJECT_PORTFOLIO_MANAGEMENT_WIP_LIMIT: "2"
      # Who approves a deployment move.
      PROJECT_PORTFOLIO_MANAGEMENT_DEPLOYMENT_APPROVER: "person:00000000-0000-4000-8000-0000000000a1"
    volumes:
      - ppm-artifacts:/app/data/artifacts
      - ppm-search:/app/data/search-index
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:5150/_readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ui-demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: project-portfolio-management-ui-with-svelte/Dockerfile
    image: project-portfolio-management-ui:local
    environment:
      PPM_DEMO_MODE: "true"
      PROJECT_PORTFOLIO_MANAGEMENT_API_URL: http://api-demo:5150
      AUTH_API_URL: http://api-demo:5150
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      api-demo:
        condition: service_healthy
      seed-demo:
        condition: service_completed_successfully

  seed-demo:
    profiles: ["demo"]
    image: docker.io/library/node:26-slim
    working_dir: /repo
    command: ["node", "scripts/seed-demo.mjs"]
    environment:
      PPM_API_URL: http://api-demo:5150
    volumes:
      - ./scripts:/repo/scripts:ro,z
    depends_on:
      api-demo:
        condition: service_healthy
    restart: "no"

  # UNSAFE development override; see the header. Login enforcement is OFF.
  api-dev-insecure:
    profiles: ["dev-insecure"]
    build: *api-build
    image: project-portfolio-management-service:local
    environment:
      <<: *api-environment
      LOCO_ENV: container-dev
      PROJECT_PORTFOLIO_MANAGEMENT_REQUIRE_AUTH: "false"
    ports:
      - "127.0.0.1:5150:5150"
    volumes:
      - ppm-artifacts:/app/data/artifacts
      - ppm-search:/app/data/search-index
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:5150/_readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Optional mail server (profile `mail`): Stalwart. Pinned to a release line, not to `latest`.
  mail:
    profiles: ["mail"]
    image: docker.io/stalwartlabs/stalwart:v0.16
    hostname: mail
    environment:
      # Optional: PPM_MAIL_ADMIN=admin:<password> pins the bootstrap administrator. Empty (the default) leaves
      # Stalwart to print a one-time password in its log (`podman compose logs mail`). Not required, so the
      # rest of the stack starts without it.
      STALWART_RECOVERY_ADMIN: ${PPM_MAIL_ADMIN:-}
    ports:
      - "127.0.0.1:8081:8080"   # administration and web mail
      - "127.0.0.1:2525:25"     # SMTP (incoming)
      - "127.0.0.1:2587:587"    # SMTP submission (the API reaches it as mail:587 inside the network)
      - "127.0.0.1:2465:465"    # SMTP submission over TLS
      - "127.0.0.1:2143:143"    # IMAP
      - "127.0.0.1:2993:993"    # IMAP over TLS
    volumes:
      - mail-config:/etc/stalwart
      - mail-data:/var/lib/stalwart
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  mail-config:
  mail-data:
  postgres-data:
  ppm-artifacts:
  ppm-search:
