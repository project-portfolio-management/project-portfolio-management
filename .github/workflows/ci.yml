name: CI

# One workflow for the whole repository (GitHub only reads the repository-root
# .github). Branch protection should require the single aggregate check `ci-ok`.
#
# Action pinning: third-party actions are pinned to a full major version tag.
# Pinning to a full commit SHA is the stricter option (a tag can be moved);
# Dependabot (.github/dependabot.yml) keeps these up to date either way.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must equal `channel` in rust-toolchain.toml (the fresh-clone job checks it).
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always
  API: project-portfolio-management-service-with-rust
  MATCHER: project-portfolio-management-matcher-with-rust
  UI: project-portfolio-management-ui-with-svelte

jobs:
  api:
    name: API (fmt, clippy, unit and DB-free tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-portfolio-management-service-with-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `toolchain` must equal rust-toolchain.toml (the fresh-clone job checks it).
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ env.API }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --lib
      # The migration crate's own checks: the embedded files are sqlx's reading of migrations/, one per old migration name.
      - run: cargo clippy -p project-portfolio-management-migration --all-targets -- -D warnings
      - run: cargo test -p project-portfolio-management-migration
      - run: >-
          cargo test --test matching --test otlp_export --test otlp_middleware
          --test licence_files --test personal_data_inventory

  api-db:
    name: API (Postgres 18 integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-portfolio-management-service-with-rust
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: project_portfolio_management_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U loco -d project_portfolio_management_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: postgres://loco:loco@localhost:5432/project_portfolio_management_test
      # The test pool has ONE connection and a 500 ms wait for it. On a busy
      # runner a request that queues behind another fails with PoolTimedOut (seen twice, in
      # two different tests, 2026-10-18). Wait up to 10 s; a real deadlock still fails.
      DB_CONNECT_TIMEOUT: "10000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `toolchain` must equal rust-toolchain.toml (the fresh-clone job checks it).
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ env.API }}
      - name: Request-level suite (tests/mod.rs)
        run: cargo test --test mod -- --ignored --test-threads=1
      - name: Real-token test binaries
        # Every tests/*.rs binary except: mod (above), the DB-free ones (run
        # in the `api` job), and the feature-gated keycloak_container and
        # fluvio_relay (they need a container runtime / broker).
        run: |
          set -euo pipefail
          skip=" mod matching otlp_export otlp_middleware licence_files keycloak_container fluvio_relay "
          for f in tests/*.rs; do
            name="$(basename "$f" .rs)"
            case "$skip" in *" $name "*) continue ;; esac
            echo "::group::cargo test --test $name -- --ignored"
            cargo test --test "$name" -- --ignored --test-threads=1
            echo "::endgroup::"
          done

  restore:
    name: Restore drill (pg_dump, restore, compare, run the test suite on it)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-portfolio-management-service-with-rust
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: loco
          POSTGRES_PASSWORD: loco
          POSTGRES_DB: ppm_source
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U loco -d ppm_source"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: postgres://loco:loco@localhost:5432/ppm_source
      ARTIFACT_DIR: ${{ github.workspace }}/restore-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pg_dump must not be older than the server (18): take the client from PGDG.
      - name: PostgreSQL 18 client tools
        working-directory: .
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          # The runner image also carries PostgreSQL 16, and Ubuntu's `pg_dump` wrapper picked that one
          # ("server version mismatch"); put the 18 binaries first and say which one runs.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version
      # `toolchain` must equal rust-toolchain.toml (the fresh-clone job checks it).
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ env.API }}
      - name: Put real data in the source database (migrations + a few suites that leave rows)
        run: |
          set -euo pipefail
          for t in approvals feeds planner private_aggregates; do
            cargo test --test "$t" -- --ignored
          done
          mkdir -p "$ARTIFACT_DIR/ab/cd" && echo "attachment bytes" > "$ARTIFACT_DIR/ab/cd/example"
      - name: Back up, restore into a scratch database, compare, run the suite on it
        working-directory: .
        run: >-
          scripts/restore-test.sh
          -t 'cd project-portfolio-management-service-with-rust && DB_URL="$RESTORED_DB_URL" cargo test --test mod -- --ignored --test-threads=1'
      - name: The same drill with an encrypted backup (passphrase)
        working-directory: .
        run: |
          umask 077
          printf '%s' "ci-only-passphrase-$GITHUB_RUN_ID" > "$RUNNER_TEMP/ppm-pass"
          BACKUP_PASSPHRASE_FILE="$RUNNER_TEMP/ppm-pass" scripts/restore-test.sh

  matcher:
    name: Matcher (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-portfolio-management-matcher-with-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `toolchain` must equal rust-toolchain.toml (the fresh-clone job checks it).
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ env.MATCHER }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

  deny:
    name: cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - project-portfolio-management-service-with-rust
          - project-portfolio-management-matcher-with-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.crate }}/Cargo.toml
          arguments: --all-features
          command: check
          # deny.toml sits next to each Cargo.toml.

  machete:
    name: cargo machete (unused dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - project-portfolio-management-service-with-rust
          - project-portfolio-management-matcher-with-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
        with:
          path: ${{ matrix.crate }}

  ui:
    name: UI (check, unit, build, Playwright and axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-portfolio-management-ui-with-svelte
    # A real Redis, so the shared session store (RG-12) is tested against the real thing and not
    # only a stand-in, in unit tests and in the browser sign-in flow.
    # Redis 8 (AGPL-3.0, RSALv2 or SSPLv1; tests only, see LICENSE.md).
    services:
      redis:
        image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ${{ env.UI }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm exec vitest run
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (includes the axe accessibility tests)
        run: pnpm exec playwright test
        env:
          CI: "true"
      - name: The OpenID Connect sign-in again, with sessions in Redis
        run: pnpm exec playwright test tests/e2e/oidc-signin.spec.ts
        env:
          CI: "true"
          OIDC_SESSION_STORE: redis
          REDIS_URL: redis://127.0.0.1:6379/0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            ${{ env.UI }}/playwright-report
            ${{ env.UI }}/test-results
          if-no-files-found: ignore

  docs:
    name: Docs (generated status, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated status is current
        run: scripts/generate-status.sh --check
      - name: Derived request bodies are current
        run: python3 scripts/generate-openapi-bodies.py --check
      - name: llms.txt matches llms.json and every listed file exists
        run: python3 scripts/generate-llms.py --check
      - name: Translation review working files are current
        run: python3 scripts/export-translation-review.py --check
      - name: The site's translation review files are current
        run: python3 scripts/export-site-translation-review.py --check
      - name: The alert rules load and their unit tests pass
        run: |
          docker run --rm -v "$PWD/operations/prometheus:/r:ro" -w /r --entrypoint promtool \
            prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038 \
            check rules alerts.yml
          docker run --rm -v "$PWD/operations/prometheus:/r:ro" -w /r --entrypoint promtool \
            prom/prometheus:v3.7.3@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038 \
            test rules alerts.test.yml
      - name: Link check (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --config lychee.toml .
          fail: true

  site:
    name: GitHub Pages site (content copy, check, build, Playwright and axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-portfolio-management.github.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: project-portfolio-management.github.io/pnpm-lock.yaml
      - name: The site's copy of the documents is current
        run: node scripts/sync-content.mjs --check
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright (every page, axe in light and dark, locale switch, right to left)
        run: pnpm exec playwright test
        env:
          CI: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: site-playwright-report
          path: |
            project-portfolio-management.github.io/playwright-report
            project-portfolio-management.github.io/test-results
          if-no-files-found: ignore

  container:
    name: Container (build and compose smoke)
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.API }}/Dockerfile
          load: true
          tags: project-portfolio-management-service:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the UI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.UI }}/Dockerfile
          load: true
          tags: project-portfolio-management-ui:local
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
      - name: Public-only test key set (so the secure stack can boot)
        run: echo "PPM_PASETO_KEYS=$(scripts/smoke-keys.sh)" >> "$GITHUB_ENV"
      - name: Build the database image (PostgreSQL with TLS)
        run: docker compose build postgres
      - name: Start the stack
        # The images are already built and tagged; do not rebuild. The `ui` profile adds the UI server.
        run: docker compose --profile ui up -d --no-build --wait --wait-timeout 180
      - name: The API reaches its database over TLS
        run: |
          used="$(docker compose exec -T postgres psql -U ppm -d project_portfolio_management -Atc \
            "SELECT count(*) FILTER (WHERE ssl), count(*) FILTER (WHERE NOT ssl) FROM pg_stat_ssl JOIN pg_stat_activity USING (pid) WHERE client_addr IS NOT NULL")"
          echo "network connections with TLS|without: $used"
          test "${used%%|*}" -gt 0
          test "${used##*|}" = 0
      - name: The UI serves its sign-in page, with its security headers, and its proxy refuses an anonymous call
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 -o /dev/null http://localhost:3000/
          curl --silent --head http://localhost:3000/en-001/signin | grep -i '^content-security-policy:.*frame-ancestors'
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/proxy/api/plans)"
          echo "anonymous GET via the UI proxy -> $code"
          test "$code" = 401
      - name: The health probes answer, and axa 0.10's old route does not
        run: |
          for probe in live ready startup; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 "http://localhost:1241/_health/$probe"
          done
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:1241/_readiness)"
          echo "GET /_readiness -> $code"
          test "$code" != 200
      - name: Login enforcement is on (anonymous API call is refused)
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:1241/api/plans)"
          echo "anonymous GET /api/plans -> $code"
          test "$code" = 401
      - name: Logs on failure
        if: failure()
        run: docker compose --profile ui logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --profile ui down -v

  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Public-only test key set (so the secure stack can boot)
        run: echo "PPM_PASETO_KEYS=$(scripts/smoke-keys.sh)" >> "$GITHUB_ENV"
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: ZAP baseline (passive) scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:1241
          rules_file_name: .zap/rules.tsv
          fail_action: true
          # Needs `issues: write`, which this workflow does not grant.
          allow_issue_writing: false
          cmd_options: -a
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  fresh-clone:
    name: Fresh clone builds with the documented commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain pin matches this workflow
        run: |
          pinned="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "rust-toolchain.toml: $pinned; workflow: $RUST_TOOLCHAIN"
          test "$pinned" = "$RUST_TOOLCHAIN"
      # `toolchain` must equal rust-toolchain.toml (the fresh-clone job checks it).
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
        with:
          toolchain: 1.100.0
      - name: Build the matcher
        run: cargo build --locked
        working-directory: ${{ env.MATCHER }}
      - name: Build the API
        run: cargo build --locked
        working-directory: ${{ env.API }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Build the UI
        working-directory: ${{ env.UI }}
        run: pnpm install --frozen-lockfile && pnpm build

  secrets:
    name: secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release binary, checked against its published SHA-256, so the scanner is pinned like the actions.
      # Reviewed findings (test keys, scaffold defaults) are listed with reasons in `.gitleaksignore`.
      - name: gitleaks 8.30.1
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner

  pins:
    name: workflow lint (pinned actions and images, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check-actions-pinned.py
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: zizmor
      - run: zizmor --offline .github

  # Single required check for branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - api
      - api-db
      - restore
      - matcher
      - deny
      - machete
      - ui
      - site
      - docs
      - container
      - zap
      - fresh-clone
      - secrets
      - pins
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          BAD: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "$NEEDS"
          test "$BAD" = "false"
