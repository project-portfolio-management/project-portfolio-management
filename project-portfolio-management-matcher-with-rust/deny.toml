# cargo-deny supply-chain policy (SEC-I1). Used by the `deny` job in
# .github/workflows/ci.yml (`cargo deny --all-features check`) and by the release workflow. Copied per crate (drift-accepted,
# same posture as the other per-crate configs); keep the crates in sync
# when this policy changes.

[advisories]
version = 2
yanked = "warn"
# No advisory is ignored: the matcher's small tree pulls none of the service's. The 11 ignores carried over from the
# service's former Loco tree were not encountered (cargo deny --all-features, 2026-11-17) and were removed; an unused
# ignore would hide the advisory if the crate came back. Add an ignore only as an exception under
# governance/security-policy.md section 16, with its reason and an expiry.
ignore = []

[licenses]
version = 2
# Permissive licenses used across the Rust stack. A dependency
# whose license is not listed FAILS the check — a deliberate signal to
# review a new license, not to silently accept it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Local, unpublished crates (the service itself, its `migration` member)
# carry no `license` field and must not be license-checked.
private = { ignore = true }

[bans]
# Duplicate versions are a warning (the dependency tree pulls a few);
# not a hard failure, so the gate stays green while still surfacing bloat.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
