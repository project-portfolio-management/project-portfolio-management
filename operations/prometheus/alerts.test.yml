# promtool unit tests for alerts.yml:
#   podman run --rm -v "$PWD/operations/prometheus:/r:ro,Z" --entrypoint promtool docker.io/prom/prometheus:v3.7.3 test rules /r/alerts.test.yml
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - name: an audit failure fires at once, and quiet counters fire nothing
    interval: 1m
    input_series:
      - series: audit_write_failed_total{instance="a"}
        values: "0 0 1 1 1"
      - series: visibility_lookup_failed_total{instance="a"}
        values: "0x20"
      - series: client_address_lockouts_total{instance="a"}
        values: "0 1 1 2 2"
    alert_rule_test:
      - eval_time: 3m
        alertname: PpmAuditWriteFailed
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: Audit rows could not be written
              description: "1 audit rows failed in the last 10 minutes; the audit trail has gaps. See operations/runbook.md."
      - eval_time: 3m
        alertname: PpmVisibilityLookupFailed
        exp_alerts: []
      - eval_time: 4m
        alertname: PpmClientAddressLockouts
        exp_alerts: []

  - name: five lockouts in a quarter of an hour fire
    interval: 1m
    input_series:
      - series: client_address_lockouts_total{instance="a"}
        values: "0 1 2 3 4 5"
    alert_rule_test:
      - eval_time: 5m
        alertname: PpmClientAddressLockouts
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Many client addresses locked out
              description: "5 lockouts in the last 15 minutes. The log line \"client address locked out\" has the time of each."

  - name: server errors above 5% for ten minutes fire
    interval: 1m
    input_series:
      - series: http_requests_total{status="200"}
        values: "0+90x30"
      - series: http_requests_total{status="503"}
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: PpmServerErrors
        exp_alerts: []
      - eval_time: 20m
        alertname: PpmServerErrors
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: More than 5% of requests fail with a server error
              description: "10% of requests answered 5xx over the last 5 minutes."

  - name: a failed scheduled job fires per job, an ok one does not
    interval: 1m
    input_series:
      - series: scheduled_job_runs_total{job="retention_purge",outcome="failed"}
        values: "0 1 1"
      - series: scheduled_job_runs_total{job="flow_export",outcome="ok"}
        values: "0 1 2"
    alert_rule_test:
      - eval_time: 2m
        alertname: PpmScheduledJobFailed
        exp_alerts:
          - exp_labels: { severity: warning, job: retention_purge }
            exp_annotations:
              summary: "Scheduled job retention_purge failed"
              description: "The scheduled_job_runs table has the error of each failed run."

  - name: the outbox alerts, counted once across replicas
    interval: 1m
    input_series:
      - series: ppm_event_outbox_rows{status="failed",instance="a"}
        values: "2x10"
      - series: ppm_event_outbox_rows{status="failed",instance="b"}
        values: "2x10"
      - series: ppm_event_outbox_oldest_owed_seconds{instance="a"}
        values: "400x10"
      - series: ppm_event_outbox_last_refresh_timestamp_seconds{instance="a"}
        values: "0x10"
    alert_rule_test:
      - eval_time: 3m
        alertname: PpmEventOutboxFailed
        exp_alerts: []
      - eval_time: 6m
        alertname: PpmEventOutboxFailed
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Events the broker refused are held as failed
              description: "2 outbox rows are failed. Fix the cause, then `project-portfolio-management task outbox_retry_failed` lists them and, with apply:true, owes them again."
      - eval_time: 6m
        alertname: PpmEventOutboxBacklog
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: Events are waiting more than 5 minutes to be sent
              description: "The oldest owed event has waited 6m 40s."
      - eval_time: 8m
        alertname: PpmEventOutboxStatsStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: No relay has read the outbox for over 2 minutes
              description: "The relay reads every 30 s; the last read was 8m 0s ago. A relay may be stuck."

  - name: no relay, no outbox alerts
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 10m
        alertname: PpmEventOutboxStatsStale
        exp_alerts: []
