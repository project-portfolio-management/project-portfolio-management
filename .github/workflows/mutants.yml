# Mutation testing, the full suites: every mutant cargo-mutants can make in the matcher, weekly and on demand.
#
# ci.yml's `mutants` job mutates only the lines a push changed and is a merge gate; this run catches what that misses
# (a test deleted, a mutant in code that has not changed since the exclusions were written). Like the fuzz and chaos
# runs, a red run is a prompt to read the report, not a merge gate, and it is not part of `ci-ok`. The report
# (mutants.out) is uploaded either way. Results and how to read them: BENCHMARKS.md, "Mutation testing".
name: Mutants

on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matcher:
    name: Matcher, every mutant
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: project-portfolio-management-matcher-with-rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Rust version is this action's ref (the `# 1.100.0` below), not an input; the fresh-clone job checks it.
      - uses: dtolnay/rust-toolchain@9522411a9bce8484da960823fc2f46e52f981f71 # 1.100.0
      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Every mutant
        run: cargo mutants --jobs 2 --no-shuffle
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-matcher
          path: project-portfolio-management-matcher-with-rust/mutants.out
          retention-days: 30
