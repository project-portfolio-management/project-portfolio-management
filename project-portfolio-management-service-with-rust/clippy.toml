# LT-9 timezone doctrine: the server runs in UTC and never consults the
# process zone. A caller's "today" comes from an explicit IANA zone (domain/src/tz.rs), and every zone comes from
# the database bundled into the binary (datetime/src/zone.rs, `TimeZoneDatabase::bundled()`), never the system's.
# Clippy finds this file from the `domain` and `datetime` crates too (it looks in the parent directories), so the
# ban covers all three. (chrono's `Local` was banned here until the move to jiff; chrono is no longer a dependency
# of the service's own code.)
# spec/rust-checked-arithmetic RCA-ENF-2. Not yet banned, because the code still uses them (RCA-ENF-3, module by module):
# `Iterator::sum` and `product` (RCA-AGG-1), `Option::unwrap_or_default` (RCA-P-3) and `Ord::clamp` (RCA-INT-6).
disallowed-types = [
  { path = "core::num::Saturating", reason = "RCA-INT-4: no saturation" },
  { path = "core::num::Wrapping", reason = "RCA-INT-4: no wrapping" },
]
disallowed-methods = [
  { path = "core::time::Duration::from_secs_f64", reason = "RCA-TIME-2: use try_from_secs_f64" },
  { path = "core::time::Duration::from_secs_f32", reason = "RCA-TIME-2: use try_from_secs_f32" },
  { path = "std::time::Instant::duration_since", reason = "RCA-TIME-1: use checked_duration_since" },
  { path = "std::time::Instant::saturating_duration_since", reason = "RCA-INT-4: no saturation" },
  { path = "jiff::ZonedDateTime::now", reason = "never read the process time zone; take an explicit zone via crate::tz" },
  { path = "jiff::tz::TimeZone::system", reason = "never read the process time zone; take an explicit zone via crate::tz" },
  { path = "jiff::tz::TimeZone::try_system", reason = "never read the process time zone; take an explicit zone via crate::tz" },
  { path = "jiff::tz::TimeZone::get", reason = "reads jiff's global database, which may be the system's; use crate::datetime::Tz" },
  { path = "jiff::tz::db", reason = "jiff's global database may be the system's; use crate::datetime::Tz (the bundled one)" },
  { path = "jiff::Timestamp::in_tz", reason = "reads jiff's global database, which may be the system's; use crate::datetime::Tz" },
  { path = "jiff::civil::Date::in_tz", reason = "reads jiff's global database, which may be the system's; use crate::datetime::Tz" },
  { path = "jiff::civil::DateTime::in_tz", reason = "reads jiff's global database, which may be the system's; use crate::datetime::Tz" },
]
